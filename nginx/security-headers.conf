# Included in every location that sets its own add_header (add_header is not
# inherited once a location defines one).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS is set by the TLS terminator (ALB/CloudFront), not here: this container
# only ever speaks plain HTTP.
