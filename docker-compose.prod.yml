# Production override for the EC2 hosts. Images come from ECR; MongoDB is
# external (Atlas), so the local mongo service is disabled.
#
#   export ECR_REGISTRY=<acct>.dkr.ecr.<region>.amazonaws.com IMAGE_TAG=<git-sha>
#   # secrets via the shell env or an env file kept outside the repo, e.g.
#   #   --env-file /etc/nocturne/prod.env  (MONGODB_URI, JWT_SECRET, ...)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#
# ALB path routing: /api/* -> backend target group (host port 5000),
#                   /*     -> frontend target group (host port 8080).
# Target group health checks: backend GET /health, frontend GET /health.

services:
  mongo:
    # Only started if someone explicitly runs `--profile local-db`.
    profiles: ["local-db"]

  backend:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/nocturne-backend:${IMAGE_TAG:?set IMAGE_TAG}
    build: !reset null
    pull_policy: missing
    restart: always
    env_file: !reset []
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI (Atlas connection string)}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS (public site origin)}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    ports: !override
      - "5000:5000"
    depends_on: !reset {}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/nocturne-frontend:${IMAGE_TAG:?set IMAGE_TAG}
    build: !reset null
    pull_policy: missing
    restart: always
    environment:
      BACKEND_URL: http://backend:5000
    ports: !override
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
