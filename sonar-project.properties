# SonarCloud (SonarQube Cloud) analysis settings - CI stage 7 "sonarcloud".
#
# >>> REPLACE_ME: set both values from SonarCloud > Project > Information
# >>> before the first run (the job fails with "project not found" otherwise).
sonar.organization=REPLACE_ME
sonar.projectKey=REPLACE_ME
sonar.projectName=Nocturne Library

# Disable "Automatic Analysis" in SonarCloud for this project; CI-based
# analysis is required for coverage import and the quality gate check.
sonar.sources=src,backend
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**,**/*.test.js,**/*.test.jsx,**/*.spec.js
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,backend/tests/**,**/*.test.js,**/*.test.jsx,**/*.spec.js,src/**/*.png,src/**/*.jpg,src/**/*.svg
sonar.coverage.exclusions=backend/seed.js,backend/tests/**,**/*.config.js

# Coverage produced by `npm test` in backend/ (jest --coverage), downloaded
# from the `test` job's artifact.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
# The job polls the quality gate and fails if it is not "Passed".
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
